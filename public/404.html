<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usman DevHub Tech & Creative Studio</title>
    <script>
      // Cloudflare Pages SPA Routing Fallback
      window.location.replace('/' + (window.location.hash || ''));
    </script>
    <style>
      body {
        margin: 0;
        background: #060608;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .loader {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255,255,255,0.1);
        border-top-color: #1430d8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div>
      <div class="loader"></div>
      <p style="font-size: 14px; color: #a1a1aa;">Redirecting to Usman DevHub Studio...</p>
    </div>
  </body>
</html>
